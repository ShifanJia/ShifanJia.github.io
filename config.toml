baseURL = "https://shifanjia.github.io/"
title = "Shifan Jia | Portfolio"
theme = "PaperMod"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = true
paginate = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
defaultTheme = "auto"
disableThemeToggle = false
description = "A minimalist personal portfolio for Shifan Jia, focused on thoughtful software, research, and product design."
author = "Shifan Jia"
keywords = ["Shifan Jia", "portfolio", "AI", "software", "product design"]
ShowReadingTime = false
ShowShareButtons = false
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowPostNavLinks = false
disableSpecial1stPost = true
disableScrollToTop = false

[params.homeInfoParams]
Title = "Shifan Jia"
Content = "I design and build thoughtful software at the intersection of AI, systems, and human-centered product experiences."
image = "/images/profile.svg"

